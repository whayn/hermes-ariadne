[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-ariadne"
version = "0.1.0"
description = "Passive, versioned verbatim archive ContextEngine for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Whayn" }]
license = "Apache-2.0"
license-files = ["LICENSE"]

[project.urls]
Repository = "https://github.com/whayn/hermes-ariadne"
Issues = "https://github.com/whayn/hermes-ariadne/issues"
Contributing = "https://github.com/whayn/hermes-ariadne/blob/main/CONTRIBUTING.md"

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1", "ruff>=0.9"]

[project.scripts]
ariadne-install = "hermes_ariadne.install:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hermes_ariadne = ["plugin.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
