# This file is also the Hermes plugin's dependency declaration (the repository root
# is the plugin). It must install nothing for Hermes: no [build-system], extras or
# dependency groups, and no runtime dependencies. Otherwise Hermes builds the package
# into its shared environment, and a second profile installing the plugin fails
# ("two workspace members are both named hermes-ariadne"). Development tooling lives
# in requirements-dev.txt; pip and build fall back to setuptools without a table.
[project]
name = "hermes-ariadne"
version = "0.2.1"
description = "Memory and context plugin for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Whayn" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

[project.urls]
Repository = "https://github.com/whayn/hermes-ariadne"
Issues = "https://github.com/whayn/hermes-ariadne/issues"
Contributing = "https://github.com/whayn/hermes-ariadne/blob/main/CONTRIBUTING.md"

[project.scripts]
ariadne-install = "hermes_ariadne.install:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hermes_ariadne = ["plugin.yaml", "prepared_plugin.yaml", "rolling_plugin.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
