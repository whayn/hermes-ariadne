name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements-dev.txt -e .
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: python -m build
      - run: git diff --check

  archive:
    name: Archive (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt -e .
      - name: Test archive, simulator and offline kernel independently of Hermes
        env:
          TMPDIR: ${{ runner.temp }}
        run: >-
          python -m pytest tests/test_store.py tests/test_crash.py tests/test_simulation.py
          tests/test_tree.py tests/test_kernel.py tests/test_kernel_demo.py
          tests/test_receipts.py tests/test_compaction.py -q

  hermes:
    name: Hermes integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the inspected Hermes baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          ref: c627ec84664d43e0b18b95d9d86d8963747d56c7
          path: .ci/hermes
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Prepare plugin development environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt -e .
      - name: Build a disposable host environment through Hermes PM
        working-directory: .ci/hermes
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-build-home
          TMPDIR: ${{ runner.temp }}
        run: python -m pm.build_env --source "$PWD" --out "$RUNNER_TEMP/hermes-python" --ci
      - name: Run the full suite with real Hermes and a loopback provider fixture
        env:
          HERMES_SOURCE: ${{ github.workspace }}/.ci/hermes
          HERMES_PYTHON: ${{ runner.temp }}/hermes-python/bin/python
          TMPDIR: ${{ runner.temp }}
        run: bash scripts/test.sh -q

  secrets:
    name: Secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan history with checksum-verified Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts=--all .

  conventions:
    name: PR conventions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check title and source branch without executing contributor code
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          python3 - <<'PY'
          import os
          import re
          types = r"(?:feat|fix|docs|test|refactor|perf|build|ci|chore|revert)"
          title = os.environ["PR_TITLE"]
          branch = os.environ["PR_BRANCH"]
          assert len(title) <= 72, "PR title must be at most 72 characters"
          assert re.fullmatch(types + r"(?:\([a-z0-9][a-z0-9-]*\))?!?: [^\s].*", title), "Use type(scope): description"
          assert not title.endswith("."), "No trailing period in PR titles"
          if os.environ["PR_AUTHOR"] != "dependabot[bot]":
              assert re.fullmatch(types + r"/[a-z0-9]+(?:-[a-z0-9]+)*", branch), "Use type/kebab-description branches"
          print("PR title and branch follow the repository conventions")
          PY
