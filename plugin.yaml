manifest_version: 2
name: ariadne
version: "0.3.0"
description: "Ariadne memory provider (profile notes, import) and context engine (one memory tree of every conversation, with zoom). Experimental; use a dedicated development profile."
author: Whayn
license: Apache-2.0
# Explicit: without it Hermes classifies the plugin as a memory-only provider and
# the general loader (the only one with ctx.llm) never registers the engine.
kind: standalone
requires_env: []
config_schema:
  tree:
    type: dict
    description: "TreeSettings for the profile-wide summary tree; unknown keys or invalid values refuse registration. exit_wait (seconds, 0 = never wait) is how long a process exiting waits for in-flight summaries; A failed summary call is asked again after retry_base seconds, doubling up to retry_max (seconds); auto_reask_lost from v0.3.0 is accepted and ignored. Logical jobs/bytes are not HTTP or billing caps. Summaries use the auxiliary task ariadne_summary (the chat model unless pinned)."
    default:
      high: 128000
      seen_high: 32000
      node_bytes: 512
      jobs: 4
      max_jobs: 0
      max_request_bytes: 65536
      max_total_request_bytes: 0
      tail_bytes: 32768
      tries: 5
      max_tokens: 1024
      timeout: 300
      exit_wait: 120
      retry_base: 30
      retry_max: 3600
