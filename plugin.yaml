manifest_version: 2
name: ariadne
version: "0.3.0"
description: "Ariadne memory provider (profile notes, import) and context engine (one memory tree of every conversation, with zoom). Experimental; use a dedicated development profile."
author: Whayn
license: Apache-2.0
# Explicit: without it Hermes classifies the plugin as a memory-only provider and
# the general loader (the only one with ctx.llm) never registers the engine.
kind: standalone
requires_env: []
config_schema:
  rolling:
    type: dict
    description: "RollingSettings limits (validated; rolling summaries are only used by the development ariadne-rolling engine); unknown keys or invalid integers refuse registration. Logical jobs/bytes are not HTTP or billing caps."
    default:
      max_logical_jobs: 64
      max_request_bytes: 65536
      max_total_request_bytes: 2097152
      max_readable_delta_bytes: 32768
      max_delta_exchanges: 4
      trigger_bytes: 4096
      max_summary_bytes: 4096
      max_navigation_bytes: 8192
      max_candidate_bytes: 65536
      reserve_tokens: 4096
      max_prefix_events: 100000
      max_checkpoint_bytes: 16777216
      max_tokens: 2048
      timeout: 60
  tree:
    type: dict
    description: "TreeSettings for the profile-wide summary tree; unknown keys or invalid values refuse registration. exit_wait (seconds, 0 = never wait) is how long a process exiting waits for in-flight summaries; auto_reask_lost (0 disables) is how often a summary lost with its exited process is asked again per node. Logical jobs/bytes are not HTTP or billing caps. Summaries use the auxiliary task ariadne_summary (the chat model unless pinned)."
    default:
      high: 128000
      seen_high: 32000
      node_bytes: 512
      jobs: 4
      max_jobs: 100000
      max_request_bytes: 65536
      max_total_request_bytes: 1073741824
      tail_bytes: 32768
      tries: 5
      max_tokens: 1024
      timeout: 300
      exit_wait: 120
      auto_reask_lost: 1
